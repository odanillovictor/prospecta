# Configuração do Cloudflare Pages (projeto + Functions).
# Segredos NÃO entram aqui: use `wrangler pages secret put NOME` ou o painel do Cloudflare.
# Localmente, copie .dev.vars.example para .dev.vars (arquivo ignorado pelo git).
name = "prospecta"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

[vars]
# Identificação enviada ao Nominatim/Overpass (exigida pela política de uso do OSM).
OSM_CONTACT = "prospecta-app/1.0 (ferramenta de prospecção para web designers)"
# Chave pública do Clerk (segura para expor). A secreta vai como segredo: npx wrangler pages secret put CLERK_SECRET_KEY
CLERK_PUBLISHABLE_KEY = "pk_test_d29uZHJvdXMtdG91Y2FuLTEwOTUuY2xlcmsuYWNjb3VudHMuZGV2JA"

# Prévias online dos sites gerados (link para mostrar ao cliente). Expiram em 90 dias.
[[kv_namespaces]]
binding = "PREVIEWS"
id = "3adc7e81aa2b4f749f1064b97c4a742f"

# Banco D1 para autenticação SaaS (usuários, cotas de uso).
# Substitua database_id pelo ID real antes do primeiro deploy:
#   npx wrangler d1 create prospecta-db
[[d1_databases]]
binding = "DB"
database_name = "prospecta-db"
database_id = "5b6a4250-ad8b-4615-ad25-0a89a9fa4592"
